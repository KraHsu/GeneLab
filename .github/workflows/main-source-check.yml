name: main-source-check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR head is dev or a hotfix branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            dev|dev/*|hotfix|hotfix/*)
              echo "OK: PR head '$HEAD_REF' is allowed to target main."
              ;;
            *)
              echo "::error::Only 'dev' / 'dev/*' (normal release) or 'hotfix' / 'hotfix/*' (urgent fix) branches may be merged into main. PR head was '$HEAD_REF'."
              exit 1
              ;;
          esac
