name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: lint
          python-version: "3.12"
      - run: uv sync --extra torch-cpu
      - run: uv run ruff check
      - run: uv run ruff format --check
      # Layering contracts (ROADMAP §9 PR R0.3 / ADR-0009). Non-blocking
      # until R7 flips to required — the baseline contains known violations
      # that R1–R6 will trim. See pyproject.toml [tool.importlinter].
      - name: Architecture lint (import-linter)
        run: uv run lint-imports
        continue-on-error: true

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: typecheck
          python-version: "3.12"
      - run: uv sync --extra torch-cpu
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: test
          python-version: "3.12"
      - run: uv sync --extra torch-cpu
      - run: uv run pytest
