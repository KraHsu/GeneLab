[project]
name = "genelab-franka-pick-and-place"
version = "0.1.0"
description = "Franka Panda pick-and-place PPO task for GeneLab."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["genelab[rl]"]

[project.entry-points."genelab.extensions"]
genelab_franka_pick_and_place = "genelab_franka_pick_and_place.tasks:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genelab_franka_pick_and_place"]

[tool.uv.sources]
genelab = { path = "../..", editable = true }
