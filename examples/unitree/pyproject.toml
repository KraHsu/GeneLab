[project]
name = "genelab-unitree"
version = "0.1.0"
description = "Unitree G1 velocity tracking example for GeneLab."
requires-python = ">=3.12"
dependencies = ["genelab[rl]"]

[project.entry-points."genelab.extensions"]
genelab_unitree = "genelab_unitree.tasks:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genelab_unitree"]
include = ["assets/**"]

[tool.uv.sources]
genelab = { path = "../..", editable = true }
