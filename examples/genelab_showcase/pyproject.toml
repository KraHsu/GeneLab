[project]
name = "genelab-showcase"
version = "0.1.0"
description = "Play-only visual showcases for GeneLab M1–M4 building blocks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["genelab", "pillow"]

[project.entry-points."genelab.extensions"]
genelab_showcase = "genelab_showcase.tasks:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genelab_showcase"]

[tool.uv.sources]
genelab = { path = "../..", editable = true }
