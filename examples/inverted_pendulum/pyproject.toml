[project]
name = "genelab-inverted-pendulum"
version = "0.1.0"
description = "Inverted-pendulum PPO tasks for GeneLab."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["genelab[rl]"]

[project.entry-points."genelab.extensions"]
genelab_inverted_pendulum = "genelab_inverted_pendulum.tasks:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genelab_inverted_pendulum"]
include = ["assets/**"]

[tool.uv.sources]
genelab = { path = "../..", editable = true }
