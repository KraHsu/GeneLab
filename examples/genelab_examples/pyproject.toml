[project]
name = "genelab-examples"
version = "0.1.0"
description = "External GeneLab example tasks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["genelab"]

[project.entry-points."genelab.extensions"]
genelab_examples = "genelab_examples.tasks:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genelab_examples"]

[tool.uv.sources]
genelab = { path = "../..", editable = true }
