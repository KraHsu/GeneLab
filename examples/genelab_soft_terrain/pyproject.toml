[project]
name = "genelab-soft-terrain"
version = "0.1.0"
description = "Analytic deformable (soft) terrain stand-and-sink demo for GeneLab (ADR-0001 stage 0)."
requires-python = ">=3.12"
dependencies = ["genelab[rl]"]

[project.entry-points."genelab.extensions"]
genelab_soft_terrain = "genelab_soft_terrain.tasks:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genelab_soft_terrain"]

[tool.uv.sources]
genelab = { path = "../..", editable = true }
