[project]
name = "genelab-franka"
version = "0.1.0"
description = "Franka Panda pick-and-place SAC+HER task for GeneLab (lift_bonus + FSM demo prefill)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["genelab[rl]"]

[project.entry-points."genelab.extensions"]
genelab_franka = "genelab_franka.tasks:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genelab_franka"]

[tool.uv.sources]
genelab = { path = "../..", editable = true }
