[project]
name = "genelab-wuji"
version = "0.1.0"
description = "Wuji dexterous-hand tasks for GeneLab."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["genelab"]

[project.optional-dependencies]
# Deploy core (real2sim + policy control). Pure-software pieces tested headlessly.
deploy = ["onnxruntime", "pyzmq", "scipy"]
# Vision observer (real camera -> ZMQ). Hardware-side, not exercised in CI.
deploy-vision = ["opencv-contrib-python", "pupil-apriltags", "pyyaml"]

[project.entry-points."genelab.extensions"]
genelab_wuji = "genelab_wuji.tasks:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genelab_wuji"]

[tool.uv.sources]
genelab = { path = "../..", editable = true }
