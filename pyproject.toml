[project]
name = "genelab"
version = "0.1.0"
description = "Isaac Lab API for RL and robotics research powered by Genesis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "genesis-world",
    "typer>=0.12",
    "rich>=13",
    "questionary>=2",
]

[project.optional-dependencies]
# Genesis requires torch>=2.8.0 (older versions emit a runtime "not supported" warning).
# PyTorch only publishes torch>=2.8 wheels for cu126 and newer (and the CPU index), so the
# older cu118 / cu121 / cu124 extras are intentionally not offered.
torch-cpu = ["torch>=2.8.0"]
torch-cu126 = ["torch>=2.8.0"]
torch-cu128 = ["torch>=2.8.0"]
torch-cu130 = ["torch>=2.8.0"]
rl = [
    "tensordict",
    "rsl_rl_lib>=5.2.0",
    "gymnasium>=1.0",
    "tensorboard>=2.20.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
    "mkdocs-include-markdown-plugin>=7",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10",
]

[project.urls]
Documentation = "https://krahsu.github.io/GeneLab/"
Repository = "https://github.com/KraHsu/GeneLab"
Issues = "https://github.com/KraHsu/GeneLab/issues"

[project.scripts]
genelab = "genelab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyright>=1.1.390",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genelab"]

[tool.uv]
conflicts = [
    [
        { extra = "torch-cpu" },
        { extra = "torch-cu126" },
        { extra = "torch-cu128" },
        { extra = "torch-cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "torch-cpu" },
    { index = "pytorch-cu126", extra = "torch-cu126" },
    { index = "pytorch-cu128", extra = "torch-cu128" },
    { index = "pytorch-cu130", extra = "torch-cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pyright]
include = ["src/genelab"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# torch's stub package doesn't re-export many factory functions; silence rather than sprinkle
# `# pyright: ignore` everywhere.
reportPrivateImportUsage = false
# rsl_rl / tensordict / genesis live behind the [rl] / sim extras and are conditional imports.
reportMissingImports = false
reportMissingTypeStubs = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
addopts = ["-ra"]
pythonpath = ["examples/genelab_examples/src", "examples/unitree/src", "examples/inverted_pendulum/src"]
testpaths = ["tests"]
