[project]
name = "genelab"
version = "0.4.0"
description = "Isaac Lab API for RL and robotics research powered by Genesis."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Chenhao Zhang", email = "charles040318@gmail.com" }]
maintainers = [{ name = "Chenhao Zhang", email = "charles040318@gmail.com" }]
dependencies = [
    # Pin to Genesis 1.2.x: Genesis changes APIs GeneLab relies on across minor
    # releases (1.1.x/1.2.x both did), so cap at the next minor until validated.
    "genesis-world>=1.2.0,<1.3.0",
    "typer>=0.12",
    "rich>=13",
    "questionary>=2",
]

[project.optional-dependencies]
# Genesis requires torch>=2.8.0 (older versions emit a runtime "not supported" warning).
# PyTorch only publishes torch>=2.8 wheels for cu126 and newer (and the CPU index), so the
# older cu118 / cu121 / cu124 extras are intentionally not offered.
torch-cpu = ["torch>=2.8.0"]
torch-cu126 = ["torch>=2.8.0"]
torch-cu128 = ["torch>=2.8.0"]
torch-cu130 = ["torch>=2.8.0"]
rl = [
    "tensordict",
    "rsl_rl_lib>=5.2.0",
    "gymnasium>=1.0",
    "tensorboard>=2.20.0",
]
# Optional second RL backend. ``genelab.rl.backends.skrl`` guards every skrl
# import, so this extra is only needed to train/play tasks with a ``SkrlAgentCfg``.
# Pinned ``<2`` until the skrl 2.0 model API is validated against GeneLab.
skrl = [
    "skrl>=1.4.0,<2",
]
# Optional third RL backend. ``genelab.rl.backends.sb3`` guards every SB3 import,
# so this extra is only needed to train/play tasks with an ``Sb3AgentCfg``. SB3
# 2.x is required (1.x targets the old ``gym`` API rather than ``gymnasium``).
sb3 = [
    "stable-baselines3>=2.0.0",
    "gymnasium>=1.0",
]
# Live plot backends for ``genelab.recording``. PyQt plots use pyqtgraph + PyQt5;
# Matplotlib plots use matplotlib. File-only recordings (NPZ/CSV/Video) don't need
# any of these — they're handled by Genesis's own dependencies (numpy + PyAV).
recording = [
    "pyqtgraph>=0.13",
    "PyQt5>=5.15",
    "matplotlib>=3.8",
]
# Genesis's built-in ImGui viewer overlay: in-viewport custom panels
# (``SimulationCfg.panels``) and slider teleop (``ImGuiTwistBridge``). ``imgui-bundle`` is
# what Genesis's own ``render`` extra pulls; the overlay lazy-imports it. The keyboard twist
# bridge needs no extra (it uses Genesis's built-in viewer keybinds); future bridges
# (gamepad, websocket, ROS2) get their own extras as their transports settle.
imgui = [
    "imgui-bundle",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
    "mkdocs-include-markdown-plugin>=7",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10",
]

[project.urls]
Documentation = "https://krahsu.github.io/GeneLab/"
Repository = "https://github.com/KraHsu/GeneLab"
Issues = "https://github.com/KraHsu/GeneLab/issues"

[project.scripts]
genelab = "genelab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyright>=1.1.390",
    "ruff>=0.8.0",
    "import-linter>=2.11",
]
# Mirrors of the `rl` / `recording` / `imgui` / `docs` extras so they get
# installed by default in this checkout (via `default-groups`) without forcing
# downstream `pip install genelab[...]` users to also pull them. Keep the dep
# specs identical to the matching `[project.optional-dependencies]` entries.
rl = [
    "tensordict",
    "rsl_rl_lib>=5.2.0",
    "gymnasium>=1.0",
    "tensorboard>=2.20.0",
]
skrl = [
    "skrl>=1.4.0,<2",
]
sb3 = [
    "stable-baselines3>=2.0.0",
    "gymnasium>=1.0",
]
recording = [
    "pyqtgraph>=0.13",
    "PyQt5>=5.15",
    "matplotlib>=3.8",
]
imgui = [
    "imgui-bundle",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
    "mkdocs-include-markdown-plugin>=7",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genelab"]

[tool.uv]
# These groups install on every `uv sync` / `uv run` in this checkout, so daily
# dev only needs to pick a torch extra (e.g. `uv sync --extra torch-cu126`).
default-groups = ["dev", "rl", "skrl", "sb3", "recording", "imgui", "docs"]
conflicts = [
    [
        { extra = "torch-cpu" },
        { extra = "torch-cu126" },
        { extra = "torch-cu128" },
        { extra = "torch-cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "torch-cpu" },
    { index = "pytorch-cu126", extra = "torch-cu126" },
    { index = "pytorch-cu128", extra = "torch-cu128" },
    { index = "pytorch-cu130", extra = "torch-cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pyright]
include = ["src/genelab"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# torch's stub package doesn't re-export many factory functions; silence rather than sprinkle
# `# pyright: ignore` everywhere.
reportPrivateImportUsage = false
# rsl_rl / tensordict / genesis live behind the [rl] / sim extras and are conditional imports.
reportMissingImports = false
reportMissingTypeStubs = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint.per-file-ignores]
# Ported Hikvision MVS SDK glue (vendored from the wuji-mjlab vision toolchain):
# the vendor camera bindings are loaded via `from MvImport.MvCameraControl_class
# import *` / `from ctypes import *` (F403/F405) after a runtime sys.path insert
# locating the SDK (E402). Both are inherent to the vendor SDK and cannot be
# resolved statically (the SDK is not installed in CI).
"examples/wuji/src/genelab_wuji/deploy/scripts/cube_world_observer.py" = ["E402", "F403", "F405"]

[tool.pytest.ini_options]
addopts = ["-ra"]
pythonpath = ["examples/genelab_examples/src", "examples/unitree/src", "examples/inverted_pendulum/src", "examples/genelab_showcase/src", "examples/franka/src", "examples/wuji/src", "examples/genelab_soft_terrain/src"]
testpaths = ["tests"]

# Layering contracts.
#
# Currently runs in CI as a non-required step (`continue-on-error: true`)
# until the baseline violation list is empty, at which point this job
# converts to a required check.
#
# ``exclude_type_checking_imports`` skips ``if TYPE_CHECKING: from ... import``
# blocks. The manager-based MDP design intentionally has domain modules
# import ``ManagerBasedRlEnv`` under that guard for parameter type hints; this
# is not an architectural violation, so we filter it out at the graph level
# rather than waiving each via ``ignore_imports``.
[tool.importlinter]
root_packages = ["genelab"]
exclude_type_checking_imports = true

# Domain modules must not reach UP into cli / rl.
[[tool.importlinter.contracts]]
name = "Domain modules are below cli / rl"
type = "forbidden"
source_modules = [
    "genelab.managers",
    "genelab.mdp",
    "genelab.entity",
    "genelab.sensor",
    "genelab.actuator",
    "genelab.terrains",
    "genelab.asset_zoo",
    "genelab.scene",
    "genelab.bridges",
    "genelab.recording",
    "genelab.envs",
]
forbidden_modules = [
    "genelab.cli",
    "genelab.rl",
]

# Term logic must not trigger asset downloads. ``asset_zoo`` is the deliberate
# exception: it is the asset catalog, so fetching assets via ``utils.download``
# (a downward domain -> utils import) is its purpose.
[[tool.importlinter.contracts]]
name = "Domain (except asset_zoo) does not import utils.download"
type = "forbidden"
source_modules = [
    "genelab.managers",
    "genelab.mdp",
    "genelab.entity",
    "genelab.sensor",
    "genelab.actuator",
    "genelab.terrains",
    "genelab.scene",
    "genelab.bridges",
    "genelab.recording",
    "genelab.envs",
]
forbidden_modules = [
    "genelab.utils.download",
]

# This contract reports violations until the cycle is broken.
[[tool.importlinter.contracts]]
name = "rl.backends does not import rl.runner"
type = "forbidden"
source_modules = ["genelab.rl.backends"]
forbidden_modules = ["genelab.rl.runner"]

# The band ordering (cli > rl > domain > config-band > utils) is enforced with
# directional ``forbidden`` contracts rather than a single ``layers`` contract: a
# ``layers`` contract lists the 11 domain packages as pipe-separated siblings, which
# importlinter treats as mutually *independent* — that wrongly forbids the legitimate
# intra-domain imports a manager-based env relies on (envs -> scene, mdp -> managers,
# entity -> actuator, …). The contracts below capture "no band imports a band above
# it" while leaving intra-band imports free.

# rl sits below cli.
[[tool.importlinter.contracts]]
name = "rl is below cli"
type = "forbidden"
source_modules = ["genelab.rl"]
forbidden_modules = ["genelab.cli"]

# Infrastructure (configs / registry / cache / utils) is the bottom of the stack and
# must not reach up into rl, cli, or any domain package.
[[tool.importlinter.contracts]]
name = "Infrastructure modules do not import up"
type = "forbidden"
source_modules = [
    "genelab.configs",
    "genelab.registry",
    "genelab.cache",
    "genelab.utils",
]
forbidden_modules = [
    "genelab.cli",
    "genelab.rl",
    "genelab.managers",
    "genelab.mdp",
    "genelab.entity",
    "genelab.sensor",
    "genelab.actuator",
    "genelab.terrains",
    "genelab.asset_zoo",
    "genelab.scene",
    "genelab.bridges",
    "genelab.recording",
    "genelab.envs",
]

[[tool.importlinter.contracts]]
name = "RL backends do not import each other"
type = "independence"
modules = [
    "genelab.rl.backends.sb3",
    "genelab.rl.backends.skrl",
    "genelab.rl.backends.rsl_rl",
]

# The contracts band (ports) is dependency-free within genelab — it must
# not reach up into the domain / rl / cli bands. (Importing torch / stdlib is fine.)
[[tool.importlinter.contracts]]
name = "contracts band imports nothing in domain / rl / cli"
type = "forbidden"
source_modules = ["genelab.contracts"]
forbidden_modules = [
    "genelab.cli",
    "genelab.rl",
    "genelab.managers",
    "genelab.mdp",
    "genelab.entity",
    "genelab.sensor",
    "genelab.actuator",
    "genelab.terrains",
    "genelab.asset_zoo",
    "genelab.scene",
    "genelab.bridges",
    "genelab.recording",
    "genelab.envs",
]

# Domain terms type-hint against ``contracts.EnvContext`` rather than the
# concrete env. Runtime imports of ``genelab.envs`` from the domain are forbidden;
# the remaining ``TYPE_CHECKING`` env hints are excluded globally
# (``exclude_type_checking_imports``) and will be migrated to ``contracts``.
[[tool.importlinter.contracts]]
name = "Domain does not import concrete envs at runtime"
type = "forbidden"
source_modules = [
    "genelab.managers",
    "genelab.mdp",
    "genelab.entity",
    "genelab.sensor",
    "genelab.actuator",
    "genelab.terrains",
    "genelab.scene",
    "genelab.bridges",
    "genelab.recording",
]
forbidden_modules = [
    "genelab.envs",
]
