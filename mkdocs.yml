site_name: GeneLab
site_description: Isaac Lab-inspired API for RL and robotics research powered by Genesis.
site_url: https://krahsu.github.io/GeneLab/
site_author: GeneLab contributors

repo_name: KraHsu/GeneLab
repo_url: https://github.com/KraHsu/GeneLab
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

exclude_docs: |
  README_CN.md

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tooltips
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/KraHsu/GeneLab

plugins:
  - search:
      lang:
        - en
        - zh
  - include-markdown
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: GeneLab
          nav_translations:
            Home: 首页
            Getting Started: 快速上手
            Installation: 安装
            Quickstart: 快速开始
            CLI: 命令行
            Overview: 总览
            Play and Train: play 与 train
            Project New: 新建项目
            Concepts: 核心概念
            Registry: 注册表
            Configs: 配置系统
            Sensors: 传感器
            Terrains: 地形
            Extensions: 扩展加载
            Examples: 示例
            Inverted Pendulum: 倒立摆
            API Reference: API 参考
            Contributing: 贡献指南
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 2
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - CLI:
      - Overview: cli/overview.md
      - Play and Train: cli/play-train.md
      - Profiling: cli/profiling.md
      - Project New: cli/project-new.md
  - Concepts:
      - Registry: concepts/registry.md
      - Configs: concepts/configs.md
      - Actuators: concepts/actuators.md
      - Sensors: concepts/sensors.md
      - Terrains: concepts/terrains.md
      - Extensions: concepts/extensions.md
  - Examples:
      - Overview: examples/overview.md
      - Inverted Pendulum: examples/inverted-pendulum.md
  - API Reference: api/reference.md
  - Contributing: contributing.md
